<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente de Contratos - Periferia IT Group</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        header { background: #003366; color: white; padding: 15px; text-align: center; border-radius: 8px 8px 0 0; }
        #chat-container { flex: 1; background: white; border: 1px solid #ccc; border-top: none; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 75%; line-height: 1.4; }
        .user { background: #e0f2fe; align-self: flex-end; color: #0369a1; }
        .assistant { background: #f1f5f9; align-self: flex-start; color: #1e293b; border: 1px solid #e2e8f0; }
        .tool-call { font-size: 0.85em; background: #fef3c7; color: #92400e; padding: 6px 10px; border-radius: 4px; margin-top: 6px; border-left: 3px solid #f59e0b; font-family: monospace; }
        #input-container { display: flex; gap: 10px; padding-top: 15px; background: #f4f6f9; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; }
        button { padding: 12px 24px; background: #003366; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #002244; }
    </style>
</head>
<body>

    <header>
        <h2>🤖 Agente Conversacional - Gestión de Contratos Vigentes</h2>
    </header>

    <div id="chat-container">
        <div class="message assistant">
            ¡Hola! Soy tu asistente de contratos. Puedo procesar el buzón, validar contratos, registrar operaciones y generar alertas de riesgo. ¿En qué te puedo ayudar hoy?
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escribe un mensaje (ej: Procesa el buzón de contratos)..." autofocus>
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') enviarMensaje();
        });

        async function enviarMensaje() {
            const text = userInput.value.trim();
            if (!text) return;

            // Mostrar mensaje del usuario
            appendMessage(text, 'user');
            userInput.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                if (data.ok) {
                    let fullReply = data.reply;
                    
                    // Si hubo llamadas a herramientas, las mostramos visualmente como exige el PRD
                    if (data.toolCalls && data.toolCalls.length > 0) {
                        fullReply += `<br>`;
                        data.toolCalls.forEach(tc => {
                            fullReply += `<div class="tool-call">⚙️ Tool Executed: <b>${tc.tool}</b></div>`;
                        });
                    }

                    appendMessage(fullReply, 'assistant');
                } else {
                    appendMessage('Error: ' + data.error, 'assistant');
                }
            } catch (err) {
                appendMessage('Error de conexión con el servidor backend.', 'assistant');
            }
        }

        function appendMessage(htmlContent, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = htmlContent;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
